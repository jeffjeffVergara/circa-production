<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>Circa · Reparto</title>
<style>
:root{--bg:#0b0f17;--card:#141a24;--border:#222c3a;--text:#e8eef6;--muted:#8da0b8;
      --green:#16a34a;--blue:#2563eb;--amber:#d97706;--red:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);
     font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     padding-bottom:40px}
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);
     padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;letter-spacing:1px;font-size:15px}
.who{font-size:12px;color:var(--muted)}
.btn-top{background:transparent;border:1px solid var(--border);color:var(--muted);
         padding:7px 12px;border-radius:8px;font-size:12px;font-family:inherit}
.wrap{padding:16px;max-width:620px;margin:0 auto}
.aviso{background:rgba(217,119,6,.12);border:1px solid rgba(217,119,6,.4);color:#fbbf24;
       border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45;margin-bottom:18px}
.aviso b{color:#fde68a}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);
   margin:26px 0 10px;font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;
      padding:14px;margin-bottom:12px}
.row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bodega{font-weight:700;font-size:15px;line-height:1.3}
.cod{font-size:11px;color:var(--muted);letter-spacing:.5px;margin-top:2px}
.num{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dir{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
.montos{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--border);
      font-variant-numeric:tabular-nums}
.pill.cash{background:rgba(22,163,74,.14);border-color:rgba(22,163,74,.45);color:#4ade80;font-weight:700}
.items{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.6}
.toggle{background:none;border:none;color:var(--muted);font-size:12px;padding:0;
        text-decoration:underline;font-family:inherit}
.acciones{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.subir{display:block;text-align:center;background:var(--green);color:#fff;font-weight:700;
       font-size:15px;padding:14px;border-radius:11px;border:none;font-family:inherit}
.subir.busy{opacity:.6}
.noent{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;
       font-family:inherit;padding:4px}
.motivo{display:none;margin-top:8px}
.motivo textarea{width:100%;background:#0f141d;border:1px solid var(--border);color:var(--text);
                 border-radius:9px;padding:10px;font-size:13px;font-family:inherit;resize:vertical}
.motivo button{margin-top:8px;width:100%;background:var(--amber);color:#111;border:none;
               padding:11px;border-radius:9px;font-weight:700;font-family:inherit;font-size:14px}
.done{border-color:rgba(22,163,74,.35)}
.done .bodega{font-weight:600}
.badge{display:inline-block;font-size:11px;padding:4px 9px;border-radius:7px;font-weight:700}
.badge.ok{background:rgba(22,163,74,.16);color:#4ade80}
.badge.no{background:rgba(220,38,38,.16);color:#f87171}
.ver{display:inline-block;margin-top:10px;font-size:13px;color:#60a5fa;text-decoration:none;
     border:1px solid var(--border);padding:8px 12px;border-radius:9px}
.vacio{color:var(--muted);font-size:13px;padding:18px;text-align:center;
       border:1px dashed var(--border);border-radius:12px}
.toast{position:fixed;left:16px;right:16px;bottom:18px;background:#111827;border:1px solid var(--border);
       border-radius:11px;padding:13px 15px;font-size:13px;opacity:0;transform:translateY(12px);
       transition:.22s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:none}
.toast.err{border-color:rgba(220,38,38,.6);color:#fca5a5}
.toast.ok{border-color:rgba(22,163,74,.6);color:#86efac}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="top">
  <div><div class="brand">CIRCA</div><div class="who" id="who">Reparto</div></div>
  <button class="btn-top" onclick="cargar()" id="btnRef">Actualizar</button>
</div>

<div class="wrap">
  <div class="aviso">
    Antes de subir: pide al cliente que <b>firme el voucher</b> y anote el monto.
    Sube la foto del <b>voucher ya firmado</b> — es el sustento de la entrega.
  </div>
  <div id="contenido"><div class="vacio">Cargando...</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
var TOKEN = location.pathname.split('/').filter(Boolean).pop() || '';
var API = '/api/transportista/' + TOKEN;
var DATA = {por_entregar: [], historia: []};

function toast(msg, tipo){
  var t = document.getElementById('toast');
  t.className = 'toast on ' + (tipo || 'ok');
  t.textContent = msg;
  setTimeout(function(){ t.className = 'toast'; }, 3800);
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function soles(n){ return 'S/' + Number(n || 0).toFixed(2); }
function hora(iso){
  if(!iso) return '';
  var d = new Date(iso);
  return d.toLocaleString('es-PE', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
}

async function cargar(){
  var b = document.getElementById('btnRef');
  b.textContent = '...';
  try {
    var r = await fetch(API + '/pedidos');
    if(!r.ok) throw new Error(r.status === 404 ? 'Link invalido. Pide uno nuevo a Circa.' : 'No se pudo cargar');
    DATA = await r.json();
    document.getElementById('who').textContent = DATA.transportista || 'Reparto';
    pintar();
  } catch(e){
    document.getElementById('contenido').innerHTML =
      '<div class="vacio">' + esc(e.message) + '</div>';
  }
  b.textContent = 'Actualizar';
}

function pintar(){
  var pend = DATA.por_entregar || [], hist = DATA.historia || [];
  var h = '<h2>Por entregar (' + pend.length + ')</h2>';
  h += pend.length ? pend.map(cardPendiente).join('')
                   : '<div class="vacio">No hay pedidos por entregar.</div>';
  h += '<h2>Subidos (ultimos ' + (DATA.dias_historia || 2) + ' dias)</h2>';
  h += hist.length ? hist.map(cardHistoria).join('')
                   : '<div class="vacio">Todavia no subiste nada.</div>';
  document.getElementById('contenido').innerHTML = h;
}

function cardPendiente(p){
  var items = (p.items || []).map(function(i){
    return esc(i.cantidad) + ' x ' + esc(i.nombre); }).join('<br>');
  return '' +
  '<div class="card" id="c-' + p.id + '">' +
    '<div class="row1">' +
      '<div><div class="bodega">' + esc(p.bodega) + '</div>' +
      (p.codigo_afiliado ? '<div class="cod">' + esc(p.codigo_afiliado) + '</div>' : '') + '</div>' +
      '<div class="num">' + esc(p.numero) + '</div>' +
    '</div>' +
    (p.direccion ? '<div class="dir">' + esc(p.direccion) + '</div>' : '') +
    '<div class="montos">' +
      '<span class="pill">Total ' + soles(p.total) + '</span>' +
      (p.cobra_efectivo > 0 ? '<span class="pill cash">Cobrar ' + soles(p.cobra_efectivo) + '</span>' : '') +
      (p.financiado > 0 ? '<span class="pill">Credito ' + soles(p.financiado) + '</span>' : '') +
    '</div>' +
    (items ? '<button class="toggle" onclick="verItems(\'' + p.id + '\')">Ver productos (' +
             (p.items || []).length + ')</button><div class="items" id="it-' + p.id +
             '" style="display:none">' + items + '</div>' : '') +
    '<div class="acciones">' +
      '<label class="subir" id="up-' + p.id + '">Subir voucher firmado' +
        '<input type="file" accept="image/*,application/pdf" capture="environment" ' +
        'onchange="subir(\'' + p.id + '\', this)"></label>' +
      '<button class="noent" onclick="abrirMotivo(\'' + p.id + '\')">No se entrego</button>' +
      '<div class="motivo" id="m-' + p.id + '">' +
        '<textarea rows="2" placeholder="Motivo: cerrado, no habia quien reciba, rechazo..."></textarea>' +
        '<button onclick="noEntregado(\'' + p.id + '\')">Reportar no entregado</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function cardHistoria(p){
  var r = p.reporte || {};
  var ok = r.resultado === 'entregado';
  return '' +
  '<div class="card done">' +
    '<div class="row1">' +
      '<div><div class="bodega">' + esc(p.bodega) + '</div>' +
        '<div class="cod">' + hora(r.reportado_at) + '</div></div>' +
      '<div><span class="badge ' + (ok ? 'ok' : 'no') + '">' +
        (ok ? 'Voucher subido' : 'No entregado') + '</span></div>' +
    '</div>' +
    '<div class="dir">' + esc(p.numero) + ' · ' + soles(p.total) + '</div>' +
    (r.observacion ? '<div class="dir">Motivo: ' + esc(r.observacion) + '</div>' : '') +
    (r.sustento_url ? '<a class="ver" href="' + esc(r.sustento_url) +
      '" target="_blank" rel="noopener">Ver voucher</a>' : '') +
  '</div>';
}

function verItems(id){
  var d = document.getElementById('it-' + id);
  d.style.display = d.style.display === 'none' ? 'block' : 'none';
}
function abrirMotivo(id){
  var d = document.getElementById('m-' + id);
  d.style.display = d.style.display === 'block' ? 'none' : 'block';
}

async function subir(id, input){
  var f = input.files && input.files[0];
  if(!f) return;
  var lbl = document.getElementById('up-' + id);
  lbl.classList.add('busy');
  lbl.firstChild.nodeValue = 'Subiendo...';
  try {
    var fd = new FormData();
    fd.append('file', f);
    var r = await fetch(API + '/pedidos/' + id + '/voucher', {method:'POST', body:fd});
    var d = await r.json().catch(function(){ return {}; });
    if(!r.ok || !d.ok) throw new Error(d.detail || 'No se pudo subir');
    toast('Voucher de ' + (d.numero || '') + ' subido', 'ok');
    await cargar();
  } catch(e){
    toast(e.message, 'err');
    lbl.classList.remove('busy');
    lbl.firstChild.nodeValue = 'Reintentar';
    input.value = '';
  }
}

async function noEntregado(id){
  var box = document.getElementById('m-' + id);
  var motivo = box.querySelector('textarea').value.trim();
  if(!motivo){ toast('Escribe el motivo', 'err'); return; }
  var btn = box.querySelector('button');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    var fd = new FormData();
    fd.append('motivo', motivo);
    var r = await fetch(API + '/pedidos/' + id + '/no-entregado', {method:'POST', body:fd});
    var d = await r.json().catch(function(){ return {}; });
    if(!r.ok || !d.ok) throw new Error(d.detail || 'No se pudo reportar');
    toast('Reportado como no entregado', 'ok');
    await cargar();
  } catch(e){
    toast(e.message, 'err');
    btn.disabled = false; btn.textContent = 'Reportar no entregado';
  }
}

cargar();
setInterval(cargar, 120000);
</script>
</body>
</html>
